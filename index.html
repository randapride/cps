<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>꿀템 모음집</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#e60012">
  <style>
    body { font-family: sans-serif; margin: 0; padding: 16px; background-color: #f5f5f5; }
    h1 { font-size: 20px; color: #333; text-align: center; }
    .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .card h3 { font-size: 16px; margin: 8px 0; }
    .btn { display: block; width: 100%; padding: 12px 0; background-color: #e60012; color: white; text-align: center; text-decoration: none; font-weight: bold; border-radius: 6px; box-sizing: border-box; }
    .footer-notice { font-size: 11px; color: #888; text-align: center; margin-top: 24px; line-height: 1.4; }
  </style>
</head>
<body>

  <h1>🛒 추천 꿀템 모음</h1>

  <!-- 추천 상품 카드리스트 -->
  <div class="card">
    <h3>자주 사는 생필품/특가 상품</h3>
    <a href=https://link.coupang.com/a/h3etU3A8su" class="btn">쿠팡에서 보기</a>
  </div>

  <!-- 푸터 필수 문구 -->
  <div class="footer-notice">
    이 포스팅은 쿠팡 파트너스 활동의 일환으로,<br>이에 따른 일정액의 수수료를 제공받습니다.
  </div>

  <!-- 팝업 모달 HTML (스크립트에서 이 ID들을 참조합니다) -->
  <div id="install-modal" style="display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.25); width: 85%; max-width: 360px; text-align: center; z-index: 9999;">
    <h3 style="margin-top:0; margin-bottom: 8px; font-size: 16px; color: #333;">앱으로 편리하게 이용하세요!</h3>
    <p style="font-size: 13px; color: #666; margin-bottom: 16px;">홈 화면에 추가하면 바로 접속할 수 있습니다.</p>
    <button id="btn-install" style="background-color: #e60012; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 14px;">앱으로 설치하기</button>
    <button id="btn-close" style="background: none; border: none; color: #999; margin-top: 10px; font-size: 12px; cursor: pointer;">나중에 하기</button>
  </div>

  <script>
    // 쿠팡 파트너스 링크 클릭 시 쿠팡 앱으로 강제 이동시키는 함수
  function openCoupangApp(url) {
    const isAndroid = /Android/i.test(navigator.userAgent);
    
    if (isAndroid) {
      // 안드로이드 패키지명(com.coupang.mobile)을 지정하여 쿠팡 앱 강제 호출
      const cleanUrl = url.replace(/^https?:\/\//, '');
      const intentUrl = `intent://${cleanUrl}#Intent;scheme=https;package=com.coupang.mobile;end;`;
      window.location.href = intentUrl;
    } else {
      // 아이폰(iOS) 또는 PC 환경
      window.location.href = url;
    }
  }

  // DOM 로드 후 기존 PWA/설치 로직 실행
  window.addEventListener('DOMContentLoaded', () => {
    let deferredPrompt;
    const installModal = document.getElementById('install-modal');
    const installBtn = document.getElementById('btn-install');
    const closeBtn = document.getElementById('btn-close');

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (installModal) installModal.style.display = 'block';
    });

    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (installModal) installModal.style.display = 'none';
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          deferredPrompt = null;
        }
      });
    }

    if (closeBtn) {
      closeBtn.addEventListener('click', () => {
        if (installModal) installModal.style.display = 'none';
      });
    }
  });
    let deferredPrompt;

    // 페이지 요소가 다 로드된 뒤 안전하게 실행
    window.addEventListener('DOMContentLoaded', () => {
      const installModal = document.getElementById('install-modal');
      const installBtn = document.getElementById('btn-install');
      const closeBtn = document.getElementById('btn-close');

      // 서비스 워커 등록
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
      }

      // 안드로이드 설치 이벤트 수신
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (installModal) {
          installModal.style.display = 'block'; // 팝업창 띄우기
        }
      });

      // 앱으로 설치하기 버튼 클릭 시
      if (installBtn) {
        installBtn.addEventListener('click', async () => {
          if (installModal) installModal.style.display = 'none';
          if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log('설치 결과:', outcome);
            deferredPrompt = null;
          }
        });
      }

      // 나중에 하기 버튼 클릭 시
      if (closeBtn) {
        closeBtn.addEventListener('click', () => {
          if (installModal) installModal.style.display = 'none';
        });
      }
    });
  </script>
</body>
</html>
