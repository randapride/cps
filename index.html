<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>꿀템 모음집</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e60012">
  <style>
    body { font-family: sans-serif; margin: 0; padding: 16px; background-color: #f5f5f5; }
    h1 { font-size: 20px; color: #333; text-align: center; }
    .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .card img { width: 100%; border-radius: 8px; }
    .card h3 { font-size: 16px; margin: 8px 0; }
    .btn { display: block; width: 100%; padding: 12px 0; background-color: #e60012; color: white; text-align: center; text-decoration: none; font-weight: bold; border-radius: 6px; box-sizing: border-box; }
    .footer-notice { font-size: 11px; color: #888; text-align: center; margin-top: 24px; line-height: 1.4; }
  </style>
</head>
<body>

  <h1>🛒 추천 꿀템 모음</h1>

  <!-- 추천 상품 1 -->
  <div class="card">
    <h3>자주 사는 생필품/특가 상품</h3>
    <!-- 아래 href에 본인의 쿠팡 파트너스 링크 입력 -->
    <a href="https://link.coupang.com/a/h3etU3A8su" class="btn" target="_blank">쿠팡에서 보기</a>
  </div>

  <!-- 푸터 필수 문구 (쿠팡 파트너스 정책 준수) -->
  <div class="footer-notice">
    이 포스팅은 쿠팡 파트너스 활동의 일환으로,<br>이에 따른 일정액의 수수료를 제공받습니다.
  </div>

  <script>
    // 서비스 워커 등록 (PWA 동작용)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
    let deferredPrompt;
  const installModal = document.getElementById('install-modal');
  const installBtn = document.getElementById('btn-install');
  const closeBtn = document.getElementById('btn-close');

  // 브라우저가 설치 준비가 완료되었을 때 실행
  window.addEventListener('beforeinstallprompt', (e) => {
    // 기본 브라우저 팝업 방지
    e.preventDefault();
    // 이벤트 객체 저장
    deferredPrompt = e;
    // 우리가 만든 Custom 팝업 모달 띄우기
    installModal.style.display = 'block';
  });

  // '앱으로 설치하기' 버튼 클릭 시
  installBtn.addEventListener('click', () => {
    installModal.style.display = 'none';
    if (deferredPrompt) {
      // 실제 브라우저 설치 시스템 팝업 호출
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          console.log('사용자가 설치를 승인함');
        }
        deferredPrompt = null;
      });
    }
  });

  // '나중에 하기' 버튼 클릭 시
  closeBtn.addEventListener('click', () => {
    installModal.style.display = 'none';
  });
  </script>
</body>
</html>
